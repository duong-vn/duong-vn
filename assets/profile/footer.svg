<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-labelledby="title description">
  <title id="title">Portfolio footer</title>
  <desc id="description">A colorful glassmorphism footer that reads Build, Learn, Ship and portfolio.tduong.online.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1b3d"/><stop offset="0.52" stop-color="#5b2576"/><stop offset="1" stop-color="#a12a6c"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#56f6ff"/><stop offset="0.5" stop-color="#b088ff"/><stop offset="1" stop-color="#ff8fcf"/></linearGradient>
  </defs>
  <rect width="1200" height="120" rx="24" fill="url(#background)"/>
  <rect x="28" y="22" width="1144" height="76" rx="18" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
  <rect x="54" y="48" width="236" height="4" rx="2" fill="url(#accent)"/>
  <text x="54" y="79" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="700" letter-spacing="2">BUILD · LEARN · SHIP</text>
  <text x="1144" y="76" text-anchor="end" fill="#d9fbff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">portfolio.tduong.online</text>
</svg>
