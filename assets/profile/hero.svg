<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Nguyen Tuan Duong profile banner</title>
  <desc id="description">A blue, violet, and pink glassmorphism banner for Nguyen Tuan Duong, Software Engineer Intern.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="0.43" stop-color="#35246d"/>
      <stop offset="1" stop-color="#9b255f"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="0.15" cy="0.15" r="0.72">
      <stop offset="0" stop-color="#2de2e6" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#2de2e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="0.86" cy="0.76" r="0.68">
      <stop offset="0" stop-color="#ff76ce" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ff76ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57f5ff"/>
      <stop offset="0.53" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#ff91d4"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="36"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#020617" flood-opacity="0.42"/></filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="174" cy="58" r="220" fill="url(#cyanGlow)" filter="url(#blur)"/>
  <circle cx="1040" cy="350" r="250" fill="url(#pinkGlow)" filter="url(#blur)"/>
  <path d="M-20 336C187 252 289 474 506 347S812 195 1220 286" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="2"/>
  <path d="M-20 357C186 273 295 493 512 366S826 217 1220 307" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <g fill="#ffffff" fill-opacity="0.42">
    <circle cx="91" cy="110" r="3"/><circle cx="157" cy="347" r="2"/><circle cx="1017" cy="72" r="3"/><circle cx="1120" cy="185" r="2"/><circle cx="924" cy="350" r="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="52" width="1072" height="316" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.34"/>
    <rect x="65" y="53" width="1070" height="74" rx="24" fill="#ffffff" fill-opacity="0.06"/>
    <circle cx="103" cy="90" r="7" fill="#ff8cab"/><circle cx="128" cy="90" r="7" fill="#ffd36d"/><circle cx="153" cy="90" r="7" fill="#64e6a5"/>
    <text x="1095" y="96" text-anchor="end" fill="#d7f9ff" fill-opacity="0.84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">PORTFOLIO / 2026</text>

    <rect x="106" y="163" width="12" height="122" rx="6" fill="url(#accent)"/>
    <text x="146" y="186" fill="#ccfbff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="3">HELLO, WORLD</text>
    <text x="144" y="243" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="52" font-weight="700">Nguyen Tuan Duong</text>
    <text x="146" y="281" fill="#ebddff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">Software Engineer Intern · Frontend / Full-stack</text>
    <text x="146" y="323" fill="#d7f9ff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Hanoi, Vietnam  ·  TypeScript  ·  React  ·  Next.js  ·  NestJS</text>

    <g transform="translate(889 169)">
      <circle cx="95" cy="95" r="78" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.35"/>
      <circle cx="95" cy="95" r="61" fill="none" stroke="url(#accent)" stroke-width="3"/>
      <path d="M95 52v86M52 95h86" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round"/>
      <circle cx="95" cy="95" r="18" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.72"/>
      <text x="95" y="178" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2">BUILD / SHIP</text>
    </g>
  </g>
</svg>
