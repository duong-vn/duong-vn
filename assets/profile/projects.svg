<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">Selected projects by Nguyen Tuan Duong</title>
  <desc id="description">Three colorful glassmorphism cards for KickZone, ZOZO Pet Services, and Serene Health.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101833"/><stop offset="0.48" stop-color="#3a1c62"/><stop offset="1" stop-color="#6d1f52"/></linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4bf0ff"/><stop offset="0.48" stop-color="#9e8bff"/><stop offset="1" stop-color="#ff87c8"/></linearGradient>
    <linearGradient id="kick" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05d9e8"/><stop offset="1" stop-color="#3968ff"/></linearGradient>
    <linearGradient id="zozo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8fd8"/><stop offset="1" stop-color="#a94fff"/></linearGradient>
    <linearGradient id="serene" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ef1bd"/><stop offset="1" stop-color="#20a6cc"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.2"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#020617" flood-opacity="0.48"/></filter>
  </defs>

  <rect width="1200" height="720" rx="28" fill="url(#background)"/>
  <circle cx="100" cy="120" r="180" fill="#2de2e6" fill-opacity="0.15"/><circle cx="1110" cy="650" r="210" fill="#ff74c2" fill-opacity="0.13"/>
  <text x="76" y="88" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="37" font-weight="700">Selected work</text>
  <text x="76" y="121" fill="#d8cfff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">PRODUCTS · SYSTEMS · USER FLOWS</text>
  <rect x="76" y="143" width="1048" height="4" rx="2" fill="url(#topGlow)"/>

  <g filter="url(#shadow)">
    <rect x="76" y="184" width="1048" height="144" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28"/>
    <rect x="76" y="184" width="12" height="144" rx="6" fill="url(#kick)"/>
    <circle cx="135" cy="234" r="25" fill="url(#kick)"/><path d="M123 234h24M135 222v24" stroke="#07152f" stroke-width="3" stroke-linecap="round"/>
    <text x="180" y="228" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="700">KickZone</text>
    <text x="180" y="254" fill="#b9faff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">NEXT.JS · NESTJS · PRISMA · POSTGRESQL</text>
    <text x="180" y="288" fill="#f0edff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Football pitch discovery, reservations, and venue operations.</text>
    <text x="1038" y="256" text-anchor="end" fill="#c7fbff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">TEAM LEAD / IN DEVELOPMENT</text>

    <rect x="76" y="364" width="1048" height="144" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28"/>
    <rect x="76" y="364" width="12" height="144" rx="6" fill="url(#zozo)"/>
    <circle cx="135" cy="414" r="25" fill="url(#zozo)"/><circle cx="126" cy="405" r="5" fill="#2c104c"/><circle cx="144" cy="405" r="5" fill="#2c104c"/><path d="M124 427c7 6 15 6 22 0" fill="none" stroke="#2c104c" stroke-width="3" stroke-linecap="round"/>
    <text x="180" y="408" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="700">ZOZO Pet Services</text>
    <text x="180" y="434" fill="#ffd4ef" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">NEXT.JS · NESTJS · MONGODB · CLOUDINARY</text>
    <text x="180" y="468" fill="#f8efff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Pet-care bookings with authentication, RBAC, and admin workflows.</text>
    <text x="1038" y="436" text-anchor="end" fill="#ffd2ed" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">SOLO / FULL-STACK</text>

    <rect x="76" y="544" width="1048" height="144" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.28"/>
    <rect x="76" y="544" width="12" height="144" rx="6" fill="url(#serene)"/>
    <circle cx="135" cy="594" r="25" fill="url(#serene)"/><path d="M122 594h26M135 581v26" stroke="#082c35" stroke-width="3" stroke-linecap="round"/>
    <text x="180" y="588" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="700">Serene Health</text>
    <text x="180" y="614" fill="#c9ffe6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">REACT · VITE · NESTJS · TYPESCRIPT</text>
    <text x="180" y="648" fill="#effff8" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Family-clinic support chatbot for triage and appointment handoff.</text>
    <text x="1038" y="616" text-anchor="end" fill="#c9ffe6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">MONOREPO / FRONTEND DEPLOYED</text>
  </g>
</svg>
